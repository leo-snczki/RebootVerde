{% extends "base.html" %} 

{% load django_bootstrap5 %}

{% block content %}
<div class="container mt-5">
    <h2>Definir Nova Senha</h2>
    <p>Insira a sua nova senha abaixo.</p>
    
    <form method="post">
        {% csrf_token %}
        {% bootstrap_form form %}
        <button type="submit" class="btn btn-primary">Alterar Senha</button>
    </form>
</div>
{% endblock %}
