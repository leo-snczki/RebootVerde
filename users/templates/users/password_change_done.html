{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Password Changed" %}{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="alert alert-success" role="alert">
        <h4 class="alert-heading">{% trans "Success!" %}</h4>
        <p>{% trans "Your password has been changed successfully." %}</p>
        <hr>
        <p class="mb-0">
            <a href="{% url 'profile' %}" class="btn btn-primary">{% trans "Back to Profile" %}</a>
        </p>
    </div>
</div>
{% endblock %}
