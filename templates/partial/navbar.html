{% load django_bootstrap5 %}

<style>
    /* Efeito Transparente e Desfocado (Glassmorphism) */
    .navbar-custom {
        background: rgba(255, 255, 255, 0.8) !important; /* Branco translúcido */
        backdrop-filter: blur(10px); /* Desfoca o fundo */
        -webkit-backdrop-filter: blur(10px);
        border-bottom: 2px solid #2d6a4f; /* Linha verde detalhada */
        padding: 0.8rem 0;
        transition: all 0.3s ease;
    }

    /* Links da Navbar */
    .navbar-custom .nav-link {
        color: #1b4332 !important; /* Verde escuro para leitura */
        font-weight: 600;
        text-transform: uppercase;
        font-size: 0.85rem;
        letter-spacing: 1px;
        transition: color 0.3s ease;
    }

    .navbar-custom .nav-link:hover {
        color: #2d6a4f !important; /* Verde mais claro no hover */
    }

    /* Centralização Mágica */
    @media (min-width: 992px) {
        .navbar-collapse {
            display: flex !important;
            justify-content: space-between;
        }
        .navbar-nav.mx-auto {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
    }

    /* Botões da Direita */
    .btn-nav-auth {
        font-weight: 700;
        letter-spacing: 0.5px;
        transition: transform 0.2s;
    }
    
    .btn-nav-auth:hover {
        transform: translateY(-2px);
    }
</style>

<nav class="navbar navbar-expand-lg navbar-light sticky-top navbar-custom">
  <div class="container position-relative">
    
    <a class="navbar-brand fw-bold" href="{% url 'index' %}" style="color: #2d6a4f;">
        </i> REBOOT<span class="text-dark">VERDE</span>
    </a>

    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      
      <ul class="navbar-nav mx-auto">
        <li class="nav-item"><a class="nav-link px-3" href="{% url 'index' %}">Home</a></li>
        <li class="nav-item"><a class="nav-link px-3" href="{% url 'about' %}">About</a></li>
        <li class="nav-item"><a class="nav-link px-3" href="{% url 'shop:product_list' %}">Market</a></li>
        <li class="nav-item"><a class="nav-link px-3" href="{% url 'game' %}">Play</a></li>
        <li class="nav-item"><a class="nav-link px-3" href="{% url 'maps' %}">EcoMap</a></li>
        <li class="nav-item"><a class="nav-link px-3" href="{% url 'contact' %}">Talk</a></li>
      </ul>

      <div class="d-flex align-items-center gap-2 ms-auto">
        <a class="btn btn-link text-decoration-none text-dark fw-bold small btn-nav-auth" href="{% url 'login' %}">LOGIN</a>
        <a class="btn btn-primary rounded-pill px-4 btn-nav-auth shadow-sm" href="{% url 'register' %}">JOIN US</a>
      </div>

    </div>
  </div>
</nav>
