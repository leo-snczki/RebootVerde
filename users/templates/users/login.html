{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<h2>Login</h2>
<form class="form-with-validation" action="/users/login/" method="post">
    {% csrf_token %}
    {{ form }}
    <button type="submit">Login</button>
</form>
<p>
    Não tem uma conta?
    <a href="{% url 'register' %}">Registre-se</a>
</p>
{% endblock %}
