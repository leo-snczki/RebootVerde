{% extends "base.html" %}
{% load django_bootstrap5 %}
{% load i18n %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card p-4 shadow">
            <h3 class="text-center">{% trans "Validate Code" %}</h3>
            <p class="text-muted text-center">{% trans "Enter the code sent to your email." %}</p>
            <form method="post">
                {% csrf_token %}
                {% bootstrap_form form %}
                <button type="submit" class="btn btn-primary w-100 rounded-pill">{% trans "Verify Code" %}</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
