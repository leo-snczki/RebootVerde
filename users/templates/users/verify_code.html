{% extends "base.html" %}
{% load i18n %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 text-center">
        <div class="card p-5">
            <div class="mb-4">
                <i class="bi bi-shield-lock text-success display-3"></i>
            </div>
            <h2 class="fw-bold">{% trans "Verify Your Email" %}</h2>
            <p class="text-muted mb-4">{% trans "We sent a 6-digit code to your inbox." %}</p>

            <form method="POST">
                {% csrf_token %}
                <div class="mb-4">
                    <input type="text" name="code" maxlength="6" 
                           class="form-control form-control-lg text-center fw-bold" 
                           placeholder="0 0 0 0 0 0" 
                           style="letter-spacing: 10px; font-size: 2rem;" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill">{% trans "Verify Code" %}</button>
            </form>

            
            <p class="mt-4 mb-0 small text-muted">
                {% trans "Didn't receive it?" %} <a href="{% url 'resend_verification_code' %}" class="text-success">{% trans "Resend code" %}</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
