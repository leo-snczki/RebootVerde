
{% extends "base.html" %}
{% load static %}
{% block content %}
    <h1>Login</h1>

    {% if form.errors %}
        <p style="color: red;">Usuário ou senha inválidos</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Entrar</button>
    </form>

    <p><a href="{% url 'register' %}">Não tem uma conta? Cadastre-se</a></p>
{% endblock %}
