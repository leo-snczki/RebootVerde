{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 p-md-5">
            <div class="text-center mb-4">
                <i class="bi bi-envelope-paper text-success h1"></i>
                <h2 class="fw-bold">Fale Conosco</h2>
                <p class="text-muted">Dúvidas sobre reciclagem? Mande uma mensagem!</p>
            </div>
            
            <form action="" method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Nome Completo</label>
                    <input type="text" name="nome" class="form-control form-control-lg" placeholder="Seu nome" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">E-mail</label>
                    <input type="email" name="email" class="form-control form-control-lg" placeholder="seu@email.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Assunto</label>
                    <input type="text" name="assunto" class="form-control" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Mensagem</label>
                    <textarea name="mensagem" class="form-control" rows="4" placeholder="Como podemos ajudar?" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill">Enviar Mensagem</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
