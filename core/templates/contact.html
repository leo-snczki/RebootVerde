{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 p-md-5">
            <div class="text-center mb-4">
                <i class="bi bi-envelope-paper text-success h1"></i>
                <h2 class="fw-bold">talk to us</h2>
                <p class="text-muted">Questions about recycling? Send us a message!</p>
            </div>
            
            <form action="" method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" class="form-control form-control-lg" placeholder="Your name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control form-control-lg" placeholder="seu@email.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Subject</label>
                    <input type="text" name="subject" class="form-control" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Message</label>
                    <textarea name="mensagem" class="form-control" rows="4" placeholder="How can we help?" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill">Send Message</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
