{% extends 'base.html' %}
{% load static %}

{% block title %}Jogar - RebootVerde Game{% endblock %}

{% block content %}
<div class="container text-center">
    <div class="mb-5">
        <h1 class="fw-bold">ecological mission</h1>
        <p class="text-muted">Learn to recycle while playing!</p>
    </div>

    <div class="card bg-dark shadow-lg border-0 d-inline-block overflow-hidden" style="border-radius: 20px;">
        <div class="bg-secondary py-2 px-3 d-flex align-items-center">
            <div class="d-flex gap-1">
                <div style="width:12px; height:12px; border-radius:50%; background:#ff5f56"></div>
                <div style="width:12px; height:12px; border-radius:50%; background:#ffbd2e"></div>
                <div style="width:12px; height:12px; border-radius:50%; background:#27c93f"></div>
            </div>
            <small class="text-white-50 ms-3">RebootVerde Engine v1.0</small>
        </div>
        <iframe 
            src="{% static 'jogos/build/index.html' %}" 
            title="Godot Game"
            width="480" 
            height="720"
            style="border: none; display: block;"
            allowfullscreen>
        </iframe>
    </div>

    <div class="mt-5">
        <a href="{% url 'index' %}" class="btn btn-link text-decoration-none text-muted">
            <i class="bi bi-arrow-left me-2"></i>Voltar ao Início
        </a>
    </div>
</div>
{% endblock %}
