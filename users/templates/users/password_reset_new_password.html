{% extends "base.html" %} 

{% load django_bootstrap5 %}

{% block content %}
<div class="container mt-5">
    <h2>Set New Password</h2>
    <p>Enter your new password below.</p>

    <form method="post">
        {% csrf_token %}
        {% bootstrap_form form %}
        <button type="submit" class="btn btn-primary">Set New Password</button>
    </form>
</div>
{% endblock %}
