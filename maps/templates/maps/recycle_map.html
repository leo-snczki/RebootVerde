{% extends "base.html" %}
{% load leaflet_tags %}

{% block title %}Map{% endblock %}

{% block content %}
{% leaflet_js %}
{% leaflet_css %}

<style>
    #map {
        width: 100%;
        height: 600px;
    }

    .controls {
        margin-bottom: 15px;
        padding: 15px;
        background: #f8f9fa;
        border-radius: 8px;
    }
</style>

<h2>REEE</h2>

<div class="controls">
    <label class="form-label"><b>Search description:</b></label>
    <div class="input-group mb-3">
        <input type="text" id="search-desc" class="form-control" placeholder="Search description...">
        <button id="search-btn" class="btn btn-primary">Search</button>
    </div>
    <div class="mb-3">
        <button id="clear-search" class="btn btn-sm btn-outline-secondary mt-2">Clear Search</button>
    </div>

    <label class="form-label"><b>Filter by establishment:</b></label>
    <div class="row" id="brand-checkboxes">
        {% for brand in brands %}
        <div class="col-md-3 col-sm-6">
            <div class="form-check">
                <input class="form-check-input brand-checkbox" type="checkbox" value="{{ brand }}" id="check-{{ forloop.counter }}">
                <label class="form-check-label" for="check-{{ forloop.counter }}">
                    {{ brand }}
                </label>
            </div>
        </div>
        {% endfor %}
    </div>
    <button id="clear-filters" class="btn btn-sm btn-outline-secondary mt-2">Clear Selection</button>
</div>

{% leaflet_map "map" callback="window.initMap" %}

<script>
    var mapInstance;
    var geojsonLayer;

    function load_data(brands) {
        let url = "{% url 'points-api' %}";
        let params = new URLSearchParams();

        if (brands && brands.length > 0) {
            brands.forEach(b => params.append('brand', b));
        }

        const search = document.getElementById('search-desc').value;

        if (search) {
            params.append('search', search);
        }

        if (params.toString()) {
            url += '?' + params.toString();
        }

        fetch(url)
            .then(response => response.json())
            .then(data => {
                if (geojsonLayer) {
                    mapInstance.removeLayer(geojsonLayer);
                }

                geojsonLayer = L.geoJSON(data, {
                    onEachFeature: function (feature, layer) {
                        var props = feature.properties;
                        var popup = `
                            <b>${props.descricao ?? "Ponto de Recolha"}</b><br>
                            ${props.morada ?? "Morada não especificada"}<br>
                            <small>${props.localidade ?? ""}</small>
                        `;
                        layer.bindPopup(popup);
                    }
                });

                geojsonLayer.addTo(mapInstance);
            })
            .catch(error => console.error('Error:', error));
    }

    function getSelectedBrands() {
        const checked = document.querySelectorAll('.brand-checkbox:checked');
        return Array.from(checked).map(cb => cb.value);
    }

    function initMap(map, options) {
        mapInstance = map;
        
        load_data([]);

        const checkboxes = document.querySelectorAll('.brand-checkbox');
        checkboxes.forEach(cb => {
            cb.addEventListener('change', function() {
                const selected = getSelectedBrands();
                load_data(selected);
            });
        });

        document.getElementById('clear-filters').addEventListener('click', function() {
            checkboxes.forEach(cb => cb.checked = false);
            load_data([]);
        });

        document.getElementById('clear-search').addEventListener('click', function() {
            document.getElementById('search-desc').value = '';
            load_data(getSelectedBrands());
        });

        document.getElementById("search-btn").addEventListener("click", function () {
        const selected = getSelectedBrands();
        load_data(selected);
        });

        document.getElementById("search-desc").addEventListener("keypress", function(e){
        if(e.key === "Enter"){
            const selected = getSelectedBrands();
            load_data(selected);
        }
    });
}
</script>
{% endblock %}
