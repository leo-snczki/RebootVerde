{% extends "base.html" %} 
{% load i18n %}
{% load django_bootstrap5 %}

{% block content %}
<div class="container mt-5">
    <h2>{% trans "Set New Password" %}</h2>
    <p>{% trans "Enter your new password below." %}</p>

    <form method="post">
        {% csrf_token %}
        {% bootstrap_form form %}
        <button type="submit" class="btn btn-primary">{% trans "Set New Password" %}</button>
    </form>
</div>
{% endblock %}
