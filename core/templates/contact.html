{% extends "base.html" %}
{% load django_bootstrap5 %}
{% load i18n %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 p-md-5">
            <div class="text-center mb-4">
                <i class="bi bi-envelope-paper text-success h1"></i>
                <h2 class="fw-bold">{% trans "Talk to Us" %}</h2>
                <p class="text-muted">{% trans "Questions about recycling? Send us a message!" %}</p>
            </div>
            
            <form action="" method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">{% trans "Full Name" %}</label>
                    <input type="text" name="name" class="form-control form-control-lg" placeholder="{% trans "Your name" %}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">{% trans "Email" %}</label>
                    <input type="email" name="email" class="form-control form-control-lg" placeholder="{% trans "Your email" %}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">{% trans "Subject" %}</label>
                    <input type="text" name="subject" class="form-control" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">{% trans "Message" %}</label>
                    <textarea name="mensagem" class="form-control" rows="4" placeholder="{% trans "How can we help?" %}" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill">{% trans "Send Message" %}</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
