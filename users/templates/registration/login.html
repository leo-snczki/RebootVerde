{% extends "base.html" %}
{% load static %}
{% block content %}
    <h1>Login</h1>

    {% if form.errors %}
        <p style="color: red;">Invalid username or password.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">login</button>
    </form>

    <p><a href="{% url 'register' %}">Don't have an account? Sign up</a></p>
{% endblock %}
