{% extends "base.html" %}
{% block title %}Recover password{% endblock %}

{% block content %}
<h2>Recover password</h2>
<p>Enter your email address below and we will send you instructions to set a new password.</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Send email</button>
</form>
{% endblock %}
